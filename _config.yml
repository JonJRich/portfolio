title: Jon Rich
description: "Jon Rich is a senior product designer who crafts simple solutions to complicated problems. 13 years’ design experience."
url: "https://jonri.ch"

# Case-study photographs stand in as a placeholder until this is false.
# A single project can opt out with `placeholders: false` in its front matter.
# The real filenames stay on each project (image:) and figure (src:).
placeholders: true

permalink: /writing/:year/:month/:day/:title/

collections:
  work:
    output: true

defaults:
  - scope:
      path: ""
      type: work
    values:
      layout: case-study

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - _build
  - .bundle
  - node_modules
