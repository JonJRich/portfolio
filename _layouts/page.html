---
layout: default
---
<article class="page{% if page.url == '/about/' %} page--column{% endif %}">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {%- if page.description %}
    <p class="dek">{{ page.description }}</p>
    {%- endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
